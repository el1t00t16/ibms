<style>
:root {
    /* MODERN SAAS TYPOGRAPHY */
    --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    
    /* PREMIUM TAILWIND-INSPIRED COLOR PALETTE */
    --primary: #4f46e5;        /* Indigo 600 */
    --primary-light: #e0e7ff;  /* Indigo 100 */
    --primary-hover: #4338ca;  /* Indigo 700 */
    
    --success: #059669;        /* Emerald 600 */
    --success-bg: #d1fae5;     /* Emerald 100 */
    
    --danger: #e11d48;         /* Rose 600 */
    --danger-bg: #ffe4e6;      /* Rose 100 */
    
    --warning: #d97706;        /* Amber 600 */
    --warning-bg: #fef3c7;     /* Amber 100 */
    
    --bg-body: #f8fafc;        /* Slate 50 */
    --bg-surface: #ffffff;     /* White */
    
    --text-main: #0f172a;      /* Slate 900 */
    --text-secondary: #475569; /* Slate 600 */
    --text-muted: #94a3b8;     /* Slate 400 */
    
    --border: #e2e8f0;         /* Slate 200 */
    --border-light: #f1f5f9;   /* Slate 100 */
    
    /* SIZING & RADII */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    
    /* ELEVATION / SHADOWS */
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
body { font-family: var(--font-family); background: var(--bg-body); color: var(--text-main); line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* === MODERN SPLIT-SCREEN LOGIN === */
#loginPage {
    position: fixed; inset: 0; z-index: 2000; background: var(--bg-surface);
    display: flex; flex-direction: column;
}
.login-split {
    display: flex; width: 100%; height: 100%;
}
.login-brand {
    flex: 1; 
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
    color: white; display: flex; flex-direction: column; justify-content: space-between;
    padding: 60px; position: relative; overflow: hidden;
}
.brand-bg-shapes { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
.brand-bg-shapes::before, .brand-bg-shapes::after {
    content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.05);
}
.brand-bg-shapes::before { width: 600px; height: 600px; top: -200px; left: -200px; }
.brand-bg-shapes::after { width: 800px; height: 800px; bottom: -300px; right: -100px; }

.brand-content { z-index: 2; position: relative; max-width: 480px; margin: auto 0; animation: slideUp 0.6s ease-out; }
.brand-logos { display: flex; gap: 16px; margin-bottom: 40px; }
.brand-logos img { height: 70px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 8px; border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.2); box-shadow: var(--shadow-md); }
.brand-content h2 { font-size: 2.5rem; font-weight: 800; line-height: 1.2; margin-bottom: 16px; letter-spacing: -0.02em; }
.brand-content p { font-size: 1.1rem; opacity: 0.8; line-height: 1.6; font-weight: 500; }
.brand-footer { z-index: 2; position: relative; font-size: 0.85rem; opacity: 0.7; font-weight: 500; }

.login-form-container {
    flex: 1; max-width: 600px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 40px; background: var(--bg-surface);
}
.login-form-wrapper { width: 100%; max-width: 380px; animation: fadeIn 0.5s ease-out; }
.login-logo-new { height: 48px; margin-bottom: 32px; object-fit: contain; }
.login-title { font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; letter-spacing: -0.02em; }
.login-subtitle { font-size: 1rem; color: var(--text-secondary); margin-bottom: 40px; font-weight: 500; }

.form-group.text-left label { text-align: left; display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
.login-form-wrapper .form-control { text-align: left; padding: 14px 16px; font-size: 1rem; border-radius: var(--radius-md); background: var(--bg-body); border: 1px solid var(--border); box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); }
.login-form-wrapper .form-control:focus { background: var(--bg-surface); border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
.btn-login { width: 100%; padding: 14px; font-size: 1rem; font-weight: 700; border-radius: var(--radius-md); display: flex; justify-content: center; align-items: center; gap: 8px; }

@media (max-width: 900px) {
    .login-brand { display: none; }
    .login-form-container { max-width: 100%; }
}

/* Utility for button spinner */
@keyframes spin { 100% { transform: rotate(360deg); } }

/* === APP LAYOUT === */
.app-layout { 
    max-width: 100%; /* Changed from 1300px to 100% to fill the whole screen */
    margin: 0 auto; 
    padding: 30px 40px; /* Slightly increased side padding so it doesn't touch the exact edges */
    display: none; /* Hidden by default */
}

/* Header */
.app-header { 
    background: var(--bg-surface); padding: 15px 30px; 
    border-radius: var(--radius-lg); border: 1px solid var(--border); 
    margin-bottom: 24px; box-shadow: var(--shadow-sm); 
    display: flex; justify-content: space-between; align-items: center; 
}

/* Header Left: eIBM Logo + Text */
.header-left { display: flex; align-items: center; gap: 16px; }
.header-logo-main { height: 60px; width: auto; object-fit: contain; }

.header-text { display: flex; flex-direction: column; justify-content: center; }
.header-text h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); margin: 0; line-height: 1.2; }
.header-text p { color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; margin: 0; }

/* Header Right: LGU + IBM + Meta */
.header-right { display: flex; align-items: center; gap: 12px; }
.header-logo-sec { height: 60px; width: auto; object-fit: contain; }
.header-divider { width: 1px; height: 30px; background: var(--border); margin: 0 5px; }

.header-meta { text-align: right; font-size: 0.75rem; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
#currentTime { color: var(--text-main); font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 2px; }

/* Logout Button */
.btn-logout { 
    background: var(--bg-surface); 
    border: 1px solid var(--border); 
    color: var(--text-secondary); 
    padding: 8px 16px; 
    border-radius: var(--radius-sm); 
    font-size: 12px; 
    font-weight: 700; 
    cursor: pointer; 
    transition: all 0.2s ease; 
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none; 
}

.btn-logout:hover {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: #fca5a5;
}

/* Tabs */
.nav-tabs { display: inline-flex; gap: 4px; margin-bottom: 24px; background: var(--border); padding: 4px; border-radius: var(--radius-md); }
.nav-tab { padding: 8px 20px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.875rem; transition: all 0.2s ease; color: var(--text-secondary); user-select: none; }
.nav-tab.active { background: var(--bg-surface); color: var(--primary); font-weight: 700; box-shadow: var(--shadow-sm); }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 24px; }
.stat-card { background: var(--bg-surface); padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.stat-card .label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
.stat-card .value { font-size: 1.875rem; font-weight: 800; line-height: 1; margin-top: 8px; color: var(--text-main); letter-spacing: -0.02em; }

/* Toolbar & Tables */
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
.search-container { position: relative; flex: 1; min-width: 320px; }
.search-input { width: 100%; padding: 12px 16px 12px 44px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-surface); font-size: 0.875rem; font-family: var(--font-family); transition: all 0.2s; box-shadow: var(--shadow-sm); color: var(--text-main); font-weight: 500;}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

.table-container { background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
thead tr { background: var(--bg-body); border-bottom: 1px solid var(--border); }
th { padding: 14px 20px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s ease; }
tbody tr:hover { background: var(--border-light); }
td { padding: 14px 20px; vertical-align: middle; }

/* Pagination Styles */
.pagination-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; background: var(--bg-surface); border-top: 1px solid var(--border);
}
.page-info { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
.pagination-controls { display: flex; gap: 8px; }
.page-btn {
    padding: 6px 14px; border: 1px solid var(--border); background: var(--bg-surface);
    border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-main);
    transition: all 0.2s; font-family: var(--font-family); box-shadow: var(--shadow-sm);
}
.page-btn:hover:not(:disabled) { background: var(--border-light); border-color: var(--border-hover); }
.page-btn:disabled { opacity: 0.5; cursor: not-allowed; background: var(--bg-body); box-shadow: none; }

/* Checkbox styling */
.chk-cell { width: 40px; text-align: center; }
input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); border-radius: 4px; border: 1px solid var(--border); }

/* Buttons & Badges */
.btn { padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.875rem; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s ease; font-family: var(--font-family); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-success { background: var(--success); color: white; box-shadow: var(--shadow-sm); }
.btn-ghost { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.btn-ghost:hover { background: var(--bg-body); border-color: var(--border-hover); }
.btn-warning { background: var(--warning); color: white; box-shadow: var(--shadow-sm); }
.btn-danger { background: var(--danger); color: white; box-shadow: var(--shadow-sm); }
.btn-icon { padding: 8px; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); }
.btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: var(--radius-sm); }
.action-group { display: flex; gap: 6px; align-items: center; }

.badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: inline-block; letter-spacing: 0.02em; text-transform: uppercase; }
.badge-ok, .badge-active { background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
.badge-new { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
.badge-delisted, .badge-stopped { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }
.badge-graduated { background: var(--border-light); color: var(--text-secondary); border: 1px solid #cbd5e1; }
.badge-payroll, .badge-on-leave-medical { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
.badge-probation { background: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
.badge-warning, .badge-on-leave-financial { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }
.badge-extended { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

/* Modal & Form */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; padding: 20px; animation: fadeIn 0.2s; }
.modal-body { background: var(--bg-surface); padding: 32px; border-radius: var(--radius-xl); width: 100%; max-width: 950px; position: relative; box-shadow: var(--shadow-xl); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); max-height: 90vh; overflow-y: auto; }
.modal-body h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; color: var(--text-main); letter-spacing: -0.02em;}
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-secondary); }
.form-control { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.9rem; background: var(--bg-surface); font-family: var(--font-family); font-weight: 500; color: var(--text-main); transition: all 0.2s; box-shadow: var(--shadow-sm); }
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
.form-control[readonly] { background: var(--bg-body); color: var(--text-secondary); box-shadow: none; border-color: transparent; }
.form-text { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; font-weight: 500;}

/* ADA Multi-Row Styling */
.ada-entry-row { background: var(--bg-body); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 12px; position: relative; animation: fadeIn 0.3s; }
.ada-remove-btn { position: absolute; top: 12px; right: 12px; color: var(--text-muted); background: var(--bg-surface); border: 1px solid var(--border); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; transition: all 0.2s; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;}
.ada-remove-btn:hover { color: var(--danger); background: var(--danger-bg); border-color: #fecaca; }

/* Report Styles */
.report-grid { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
.report-sidebar { background: var(--bg-surface); padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.report-main { display: flex; flex-direction: column; gap: 24px; }
.summary-box { background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm); }
.summary-header { padding: 16px 20px; background: var(--bg-body); border-bottom: 1px solid var(--border); font-weight: 700; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
.report-row { cursor: pointer; transition: background 0.2s; }
.report-row:hover { background: var(--border-light); }
.report-row.active { background: var(--primary-light); border-left: 3px solid var(--primary); }

/* Matrix Table Styling */
.matrix-table-container { overflow-x: auto; }
.matrix-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.matrix-table th, .matrix-table td { border: 1px solid var(--border); padding: 10px 14px; text-align: center; }
.matrix-table th { background-color: var(--bg-body); font-weight: 700; color: var(--text-secondary); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
.matrix-table td:first-child { text-align: left; font-weight: 600; color: var(--text-main); background-color: var(--bg-body); }
.matrix-table tr:last-child td { font-weight: 800; background-color: var(--border-light); }

/* Dismissal Preview Box */
.dismissal-preview { background: var(--bg-body); border: 1px dashed var(--border); padding: 16px; border-radius: var(--radius-md); margin-top: 16px; }
.dismissal-preview.danger { background: var(--danger-bg); border-color: #fecaca; }
.dismissal-preview.warning { background: var(--warning-bg); border-color: #fde68a; }

/* Batch Review List */
.batch-review-box { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-md); margin: 16px 0; background: var(--bg-body); }
.batch-table { width: 100%; font-size: 0.8rem; }
.batch-table th { position: sticky; top: 0; background: var(--border-light); padding: 10px; font-weight: 700; color: var(--text-secondary); text-align: left; z-index: 10; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em;}
.batch-table td { padding: 10px; border-bottom: 1px solid var(--border); }
.batch-table tr:last-child td { border-bottom: none; }

/* View Profile */
.profile-header { background: var(--bg-body); padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 0.9rem; }
.profile-item label { font-size: 0.75rem; color: var(--text-secondary); display: block; margin-bottom: 4px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em; }
.profile-item div { font-weight: 600; color: var(--text-main); }
.sem-history-table { width: 100%; font-size: 0.85rem; margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.sem-history-table th { background: var(--border-light); padding: 12px; text-align: left; text-transform: uppercase; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-secondary);}
.sem-history-table td { padding: 10px 12px; border-top: 1px solid var(--border); }

/* --- UPDATED LOADER CSS --- */
#loader { 
    position: fixed; inset: 0; background: var(--bg-surface); z-index: 2500; 
    display: none; align-items: center; justify-content: center; flex-direction: column; 
}
.loader-logo {
    width: 120px; 
    height: auto;
    margin-bottom: 30px;
    animation: pulse 1.5s infinite ease-in-out;
}
@keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.9; }
    50% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.9; }
}
.progress-wrapper {
    width: 320px;
    background: var(--bg-body);
    height: 12px;
    border-radius: var(--radius-xl);
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    border: 1px solid var(--border);
}
.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-hover));
    width: 0%;
    border-radius: var(--radius-xl);
    transition: width 0.3s ease-out;
    box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
}
.progress-text {
    margin-top: 12px;
    font-family: var(--font-family);
    font-weight: 700;
    color: var(--text-secondary);
    font-size: 0.95rem;
    letter-spacing: -0.01em;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

#printArea, #printProfileArea, #printPayrollFormArea, #printFursArea, #printAdaArea, #printReportArea, #printMatrixArea { display: none; }

/* Styles for Print Layout (UNCHANGED) */
@media print {
@page { margin: 0; size: auto; } 
html, body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: visible !important; height: auto !important; min-height: auto !important; }
::-webkit-scrollbar { display: none !important; }
* { scrollbar-width: none !important; }
.swal2-container { display: none !important; }
.app-layout, .modal-overlay, #loader, #loginPage { display: none !important; }
#printProfileArea, #printArea, #printPayrollFormArea, #printFursArea, #printAdaArea, #printReportArea, #printMatrixArea { display: none; }

body.printing-profile #printProfileArea { display: block !important; }
body.printing-list #printArea { display: block !important; }
body.printing-form #printPayrollFormArea { display: block !important; }
body.printing-furs #printFursArea { display: block !important; }
body.printing-ada #printAdaArea { display: block !important; }
body.printing-report #printReportArea { display: block !important; }
body.printing-matrix #printMatrixArea { display: block !important; }

/* List Print Styles */
.print-page { width: 8.5in; height: 13in; padding: 0.40in; display: flex; flex-direction: column; gap: 0.20in; page-break-after: always; }
.copy-section { flex: 1; display: flex; flex-direction: column; }
.copy-section:first-child { padding-bottom: 0.15in; border-bottom: 1pt dashed #999; }
.copy-top { display: flex; justify-content: space-between; gap: 10pt; margin-bottom: 8pt; }
.p-header h2 { font-size: 14pt; margin: 0; font-weight: 900; }
.copy-tag { color: #000; padding: 2pt 10pt; font-size: 8pt; font-weight: 700; }
.p-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.p-table th, .p-table td { border: 0.5pt solid #000; font-size: 8pt; padding: 2pt 4pt; height: 16pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-table th { background: #f2f2f2; font-weight: 800; }
.col-no { width: 6%; text-align: center; }
.col-ibm { width: 15%; text-align: center; }
.col-name { width: 45%; text-align: left; padding-left: 8pt !important; }
.col-acc { width: 22%; text-align: center; }
.col-year { width: 12%; text-align: center; }
.footer-line { margin-top: auto; display: flex; justify-content: space-between; font-size: 9pt; font-weight: 700; padding-top: 10pt; }

/* Screen Preview Fixes */
#printArea { width: 8.5in; padding: 0.40in; background: white; }
#printProfileArea { padding: 12px; }

/* REPORT PRINTING */
#printReportArea { padding: 0.5in; font-family: 'Arial', sans-serif; }
.rep-header { text-align: center; margin-bottom: 20px; }
