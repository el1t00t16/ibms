"use strict";
/**
 * LGU Malungon IBMS - Portal Shell & Interactive Controller
 * Handles sidebar navigation, modern SweetAlert toast notifications,
 * slide-over scholar drawer, KPI dashboard sync, floating batch actions,
 * alumni directory, external grants, and audit trails.
 */
// Global state for auxiliary views
let alumniCurrentPage = 1;
const alumniRowsPerPage = 15;
let filteredAlumniData = [];
let ogCurrentPage = 1;
const ogRowsPerPage = 15;
let filteredOgData = [];
let auditCurrentPage = 1;
const auditRowsPerPage = 15;
let auditLogsData = [];
let filteredAuditData = [];
/**
 * ==========================================================================
 * MODERN SWEETALERT2 TOAST NOTIFICATION SYSTEM
 * Sleek, non-intrusive top-right floating toasts for alerts & status updates
 * while preserving full modal dialogs for interactive confirmations/prompts.
 * ==========================================================================
 */
(function initModernToastSystem() {
    if (typeof window.Swal === 'undefined')
        return;
    // Create standard ModernToast instance
    const ModernToast = window.Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        showCloseButton: true,
        timer: 3200,
        timerProgressBar: true,
        background: '#ffffff',
        color: '#0f172a',
        didOpen: (toast) => {
            toast.addEventListener('mouseenter', window.Swal.stopTimer);
            toast.addEventListener('mouseleave', window.Swal.resumeTimer);
        }
    });
    window.ModernToast = ModernToast;
    // Direct helper function for toast notifications
    window.showToast = function (title, message = '', icon = 'info') {
        return ModernToast.fire({
            icon: icon,
            title: title,
            text: message
        });
    };
})();
// DOM Ready initialization
document.addEventListener('DOMContentLoaded', () => {
    initSidebarState();
    initLiveClock();
    hookBatchObserver();
    hookDataSync();
});
/**
 * Live Clock in Header
 */
function initLiveClock() {
    function tick() {
        const clockEl = document.getElementById('liveClockText');
        if (clockEl) {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }
    }
    tick();
    setInterval(tick, 1000);
}
/**
 * 1. SIDEBAR NAVIGATION & VIEW SWITCHER
 */
function switchNavTab(tabName, subFilter) {
    const norm = (tabName || 'dashboard').toLowerCase().replace(/[-_]/g, '');
    // View Mapping: normalizes tab name to target panel ID, sidebar nav ID, and page title
    const viewMapping = {
        'dashboard': { panelId: 'dashboardTab', navId: 'nav-dashboard', title: 'Executive KPI Dashboard' },
        'verification': { panelId: 'verificationTab', navId: 'nav-verification', title: 'Iskolar Registry' },
        'registry': { panelId: 'verificationTab', navId: 'nav-verification', title: 'Iskolar Registry' },
        'payroll': { panelId: 'payrollTab', navId: 'nav-payroll', title: 'Payroll Registry' },
        'requirements': { panelId: 'requirementsTab', navId: 'nav-requirements', title: 'Requirements Hub' },
        'reports': { panelId: 'reportsTab', navId: 'nav-reports', title: 'Reports & Matrix Analytics' },
        'alumni': { panelId: 'alumniTab', navId: 'nav-alumni', title: 'Alumni Directory' },
        'othergrants': { panelId: 'otherGrantsTab', navId: 'nav-other-grants', title: 'Other Grants Registry' },
        'auditlogs': { panelId: 'auditLogsTab', navId: 'nav-audit-logs', title: 'System Audit Trail' },
        'settings': { panelId: 'settingsTab', navId: 'nav-settings', title: 'Portal Administration' }
    };
    const target = viewMapping[norm] || viewMapping['dashboard'];
    // 1. Hide all 9 view panels
    const views = [
        'dashboardTab',
        'verificationTab',
        'payrollTab',
        'reportsTab',
        'requirementsTab',
        'alumniTab',
        'otherGrantsTab',
        'auditLogsTab',
        'settingsTab'
    ];
    views.forEach(vId => {
        const el = document.getElementById(vId);
        if (el) {
            el.style.display = 'none';
            el.classList.remove('active');
        }
    });
    // 2. Display active target panel
    const targetPanel = document.getElementById(target.panelId);
    if (targetPanel) {
        targetPanel.style.display = 'block';
        targetPanel.classList.add('active');
    }
    // 3. Update active state in sidebar nav items
    document.querySelectorAll('.lgu-nav-item, .sidebar-nav-item').forEach(item => {
        item.classList.remove('active');
    });
    const activeNavItem = document.getElementById(target.navId);
    if (activeNavItem) {
        activeNavItem.classList.add('active');
    }
    // 4. Update Header Breadcrumb & Title
    const titleEl = document.getElementById('headerCurrentTitle');
    if (titleEl)
        titleEl.textContent = target.title;
    const breadcrumbEl = document.getElementById('headerBreadcrumbCurrent');
    if (breadcrumbEl)
        breadcrumbEl.textContent = target.title;
    // 5. Trigger view-specific handlers
    if (norm === 'dashboard') {
        updateDashboardKPIs();
    }
    else if (norm === 'verification' || norm === 'registry') {
        if (subFilter === 'active') {
            showActiveScholarsFromDashboard();
            return;
        }
        if (typeof renderTable === 'function')
            renderTable();
        updateDashboardKPIs();
    }
    else if (norm === 'payroll') {
        if (typeof renderPayrollTable === 'function')
            renderPayrollTable();
        updateDashboardKPIs();
    }
    else if (norm === 'requirements') {
        if (typeof loadRequirementsData === 'function')
            loadRequirementsData();
    }
    else if (norm === 'reports') {
        if (typeof window.switchReportSubTab === 'function') {
            window.switchReportSubTab(subFilter || 'analytics');
        }
        else if (typeof window.generateReport === 'function') {
            window.generateReport();
        }
        else if (typeof window.updateReportUI === 'function') {
            window.updateReportUI();
        }
    }
    else if (norm === 'alumni') {
        renderAlumniTable();
    }
    else if (norm === 'othergrants') {
        renderOtherGrantsTable();
    }
    else if (norm === 'auditlogs') {
        loadAuditLogs();
    }
    else if (norm === 'settings') {
        updateSettingsInfo();
    }
    // 6. Close mobile sidebar if open
    const sidebar = document.getElementById('lguSidebar') || document.getElementById('appSidebar');
    if (sidebar && sidebar.classList.contains('mobile-open')) {
        sidebar.classList.remove('mobile-open');
    }
}

/**
 * Sidebar Collapse & Expand
 */
function updateSidebarToggleElements(isCollapsed) {
    const bottomToggleBtn = document.getElementById('sidebarCollapseToggleBtn');
    if (bottomToggleBtn) {
        bottomToggleBtn.setAttribute('title', isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar');
        bottomToggleBtn.setAttribute('data-tooltip', isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar');
        const label = bottomToggleBtn.querySelector('.sidebar-toggle-label');
        if (label)
            label.textContent = isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar';
    }
    const topbarToggleBtn = document.getElementById('desktopSidebarToggleBtn');
    if (topbarToggleBtn) {
        topbarToggleBtn.setAttribute('title', isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar');
    }
    const headerBrand = document.querySelector('.lgu-sidebar-header .lgu-brand');
    if (headerBrand) {
        headerBrand.setAttribute('title', isCollapsed ? 'Click to Expand Sidebar' : 'e-IBM Portal - Malungon');
    }
}
function toggleSidebarCollapse() {
    const sidebar = document.getElementById('lguSidebar') || document.getElementById('appSidebar');
    const layout = document.querySelector('.lgu-layout');
    if (!sidebar)
        return;
    sidebar.classList.toggle('collapsed');
    if (layout) {
        layout.classList.toggle('sidebar-collapsed');
    }
    const isCollapsed = sidebar.classList.contains('collapsed');
    localStorage.setItem('ibms_sidebar_collapsed', isCollapsed ? '1' : '0');
    updateSidebarToggleElements(isCollapsed);
}
window.toggleSidebarCollapse = toggleSidebarCollapse;
window.toggleSidebar = toggleSidebarCollapse; // Alias for compatibility
function expandSidebar() {
    const sidebar = document.getElementById('lguSidebar') || document.getElementById('appSidebar');
    const layout = document.querySelector('.lgu-layout');
    if (!sidebar)
        return;
    sidebar.classList.remove('collapsed');
    if (layout)
        layout.classList.remove('sidebar-collapsed');
    localStorage.setItem('ibms_sidebar_collapsed', '0');
    updateSidebarToggleElements(false);
}
window.expandSidebar = expandSidebar;
function collapseSidebar() {
    const sidebar = document.getElementById('lguSidebar') || document.getElementById('appSidebar');
    const layout = document.querySelector('.lgu-layout');
    if (!sidebar)
        return;
    sidebar.classList.add('collapsed');
    if (layout)
        layout.classList.add('sidebar-collapsed');
    localStorage.setItem('ibms_sidebar_collapsed', '1');
    updateSidebarToggleElements(true);
}
window.collapseSidebar = collapseSidebar;
function toggleMobileSidebar() {
    const sidebar = document.getElementById('lguSidebar') || document.getElementById('appSidebar');
    if (sidebar) {
        sidebar.classList.toggle('mobile-open');
    }
}
window.toggleMobileSidebar = toggleMobileSidebar;
function initSidebarState() {
    const isCollapsed = localStorage.getItem('ibms_sidebar_collapsed') === '1';
    if (isCollapsed) {
        const sidebar = document.getElementById('lguSidebar') || document.getElementById('appSidebar');
        const layout = document.querySelector('.lgu-layout');
        if (sidebar)
            sidebar.classList.add('collapsed');
        if (layout)
            layout.classList.add('sidebar-collapsed');
    }
    updateSidebarToggleElements(isCollapsed);
    // Keyboard shortcut: Ctrl + B to toggle sidebar
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
            const target = e.target;
            if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
                return;
            }
            e.preventDefault();
            toggleSidebarCollapse();
        }
    });
}
/**
 * 2. DASHBOARD KPI & BADGE SYNCHRONIZATION
 */
function updateDashboardKPIs() {
    // 1. Total Active
    const totalActiveEl = document.getElementById('stat-total-active');
    const dashActiveEl = document.getElementById('dashTotalActive');
    const badgeActiveEl = document.getElementById('badge-active-count');
    const sideScholarEl = document.getElementById('side-scholar-count');
    const activeCount = totalActiveEl ? totalActiveEl.innerText : (dbData ? dbData.filter(s => s.status === 'ACTIVE').length : 0);
    const formattedActive = Number(activeCount).toLocaleString();
    if (dashActiveEl)
        dashActiveEl.innerText = formattedActive;
    if (badgeActiveEl)
        badgeActiveEl.innerText = formattedActive;
    if (sideScholarEl)
        sideScholarEl.innerText = formattedActive;
    // 2. Payroll Progress
    const payCurrEl = document.getElementById('stat-payroll-current');
    const payTotEl = document.getElementById('stat-payroll-total');
    const payPctEl = document.getElementById('stat-pct-text');
    const dashCurrEl = document.getElementById('dashPayrollCurrent');
    const dashTotEl = document.getElementById('dashPayrollTotal');
    const dashPctEl = document.getElementById('dashPayrollPct');
    const dashBarEl = document.getElementById('dashPayrollProgressBar');
    const badgePayEl = document.getElementById('badge-payroll-count');
    const sidePayEl = document.getElementById('side-payroll-count');
    if (payCurrEl && dashCurrEl)
        dashCurrEl.innerText = payCurrEl.innerText;
    if (payTotEl && dashTotEl)
        dashTotEl.innerText = payTotEl.innerText;
    if (payPctEl && dashPctEl)
        dashPctEl.innerText = payPctEl.innerText;
    if (badgePayEl && payCurrEl)
        badgePayEl.innerText = payCurrEl.innerText;
    if (sidePayEl && payCurrEl)
        sidePayEl.innerText = payCurrEl.innerText;
    if (dashBarEl && payCurrEl && payTotEl) {
        const c = parseInt(payCurrEl.innerText) || 0;
        const t = parseInt(payTotEl.innerText) || 1;
        const pct = Math.min(100, Math.round((c / t) * 100));
        dashBarEl.style.width = pct + '%';
    }
    // 3. Alumni Count
    const gradCount = (gradData && gradData.length) ? gradData.length : 1227;
    const dashGradEl = document.getElementById('dashTotalGraduates');
    const badgeAlumniEl = document.getElementById('badge-alumni-count');
    const sideGradEl = document.getElementById('side-grad-count');
    if (dashGradEl)
        dashGradEl.innerText = gradCount.toLocaleString();
    if (badgeAlumniEl)
        badgeAlumniEl.innerText = gradCount.toLocaleString();
    if (sideGradEl)
        sideGradEl.innerText = gradCount.toLocaleString();
    // 4. Other Grants Count
    const ogCount = (otherGrantsData && otherGrantsData.length) ? otherGrantsData.length : 0;
    const dashOgEl = document.getElementById('dashTotalOtherGrants');
    const badgeOgEl = document.getElementById('badge-other-grants-count');
    const sideOgEl = document.getElementById('side-og-count');
    if (dashOgEl)
        dashOgEl.innerText = ogCount.toLocaleString();
    if (badgeOgEl)
        badgeOgEl.innerText = ogCount.toLocaleString();
    if (sideOgEl)
        sideOgEl.innerText = ogCount.toLocaleString();
    // 5. Active Semester Badge
    if (sems && sems.length > 0) {
        const latestSem = sems[sems.length - 1];
        const dashSemBadge = document.getElementById('dashActiveSemBadge');
        if (dashSemBadge)
            dashSemBadge.innerText = 'SY ' + latestSem;
        const headerSem = document.getElementById('headerActiveSemText') || document.getElementById('headerSemText');
        if (headerSem)
            headerSem.innerText = 'Active: ' + latestSem;
    }
    // 6. Status Breakdown Chips
    if (dbData && dbData.length > 0) {
        const counts = {};
        dbData.forEach(s => {
            const st = s.status || 'UNKNOWN';
            counts[st] = (counts[st] || 0) + 1;
        });
        const chipContainer = document.getElementById('dashStatusChips');
        if (chipContainer) {
            chipContainer.innerHTML = Object.entries(counts).map(([status, count]) => {
                let badgeClass = 'badge-lgu-neutral';
                if (status === 'ACTIVE')
                    badgeClass = 'badge-lgu-success';
                else if (status === 'PROBATION')
                    badgeClass = 'badge-lgu-warning';
                else if (status === 'WARNING')
                    badgeClass = 'badge-lgu-danger';
                else if (status === 'GRADUATED')
                    badgeClass = 'badge-lgu-gold';
                else if (status === 'EXTENDED')
                    badgeClass = 'badge-lgu-primary';
                return `<div class="badge-lgu ${badgeClass}" style="font-size: 0.8rem; padding: 6px 12px; cursor: pointer;" onclick="switchNavTab('verification'); filterByStatusChip('${status}')">
                    <strong>${status}</strong>: ${count}
                </div>`;
            }).join('');
        }
    }
}
window.updateDashboardKPIs = updateDashboardKPIs;
/**
 * 3. QUICK FILTER CHIPS
 */
function applyChipFilter(status, btn) {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    if (btn)
        btn.classList.add('active');
    const searchInput = document.getElementById('searchV');
    const semStatusSelect = document.getElementById('af-sem-status');
    if (status === 'ALL') {
        if (semStatusSelect)
            semStatusSelect.value = '';
        if (searchInput)
            searchInput.value = '';
        applyAdvancedFilters();
    }
    else if (status === 'ACTIVE') {
        if (semStatusSelect)
            semStatusSelect.value = 'active_baseline';
        if (searchInput)
            searchInput.value = '';
        applyAdvancedFilters();
    }
    else if (status === 'PENDING_RENEWAL') {
        if (semStatusSelect)
            semStatusSelect.value = 'pending';
        if (searchInput)
            searchInput.value = '';
        applyAdvancedFilters();
    }
    else {
        // Status like ON-HOLD, PROBATION, WARNING, GRADUATED, DELISTED, EXTENDED
        if (semStatusSelect)
            semStatusSelect.value = '';
        if (searchInput) {
            searchInput.value = status;
            applyAdvancedFilters();
        }
    }
}
function filterByStatusChip(status) {
    if (typeof switchNavTab === 'function') {
        switchNavTab('verification');
    } else if (typeof switchTab === 'function') {
        switchTab('verification');
    }

    // Reset dropdown filters so they don't accidentally conflict
    const brgySelect = document.getElementById('af-barangay');
    if (brgySelect) brgySelect.value = '';
    const yearSelect = document.getElementById('af-year');
    if (yearSelect) yearSelect.value = '';
    const payrollSelect = document.getElementById('af-payroll');
    if (payrollSelect) payrollSelect.value = '';
    const semStatusSelect = document.getElementById('af-sem-status');
    if (semStatusSelect) semStatusSelect.value = '';

    // Match chip in registry toolbar if available
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    const chips = document.querySelectorAll('.filter-chip');
    let matchedChip = null;
    chips.forEach(chip => {
        const txt = (chip.textContent || '').trim().toUpperCase();
        const sUpper = String(status || '').toUpperCase();
        if (txt === sUpper || (sUpper === 'ACTIVE' && txt.includes('ACTIVE')) || (sUpper === 'ALL' && txt.includes('ALL')) || txt.includes(sUpper)) {
            matchedChip = chip;
        }
    });
    if (matchedChip) {
        matchedChip.classList.add('active');
    }

    const searchInput = document.getElementById('searchV');
    if (searchInput) {
        if (status === 'ALL') {
            searchInput.value = '';
        } else {
            searchInput.value = status;
        }
    }

    if (typeof applyAdvancedFilters === 'function') {
        applyAdvancedFilters();
    }
}

/**
 * Calculates the stipend amount for a given semester period
 * 2023-2024/2nd Sem onward = 7,000 PHP, prior terms = 5,000 PHP
 */
function getSemesterStipendAmount(sem) {
    if (!sem)
        return 5000;
    const str = String(sem).trim();
    const match = str.match(/(\d{4})-(\d{4})/);
    if (match) {
        const startYear = parseInt(match[1], 10);
        if (startYear < 2023)
            return 5000;
        if (startYear === 2023) {
            if (str.toLowerCase().includes('2nd'))
                return 7000;
            return 5000;
        }
        return 7000;
    }
    if (typeof sems !== 'undefined' && Array.isArray(sems)) {
        const idx = sems.indexOf(str);
        const thresholdIdx = sems.indexOf("2023-2024/2nd Sem");
        if (idx !== -1 && thresholdIdx !== -1) {
            return idx >= thresholdIdx ? 7000 : 5000;
        }
    }
    return 7000;
}
window.getSemesterStipendAmount = getSemesterStipendAmount;
/**
 * 4. SLIDE-OVER SCHOLAR QUICK PROFILE DRAWER
 */
function openScholarDrawer(ibmId) {
    let scholar = (dbData || []).find(s => s.ibmId === ibmId);
    // If not found in active masterlist (dbData), check gradData (Alumni Registry)
    if (!scholar && gradData && gradData.length > 0) {
        const grad = gradData.find(g => g.ibmId === ibmId);
        if (grad) {
            const batchYear = grad.yearGraduated || grad.gradYear || grad.year || '';
            const yrDisplay = batchYear ? `Graduated (Batch ${batchYear})` : 'Graduated';
            const details = [
                grad.honor ? `🏆 Latin Honor: ${grad.honor}` : '',
                grad.employmentStatus ? `💼 Status: ${grad.employmentStatus}` : '',
                grad.company ? `🏢 Company: ${grad.company}` : '',
                grad.email ? `✉️ Email: ${grad.email}` : ''
            ].filter(Boolean);
            const semRecs = { ...(grad.semesterRecords || {}) };
            if (typeof pData !== 'undefined' && Array.isArray(pData)) {
                pData.filter((p) => p.ibmId === grad.ibmId && p.grantPeriod).forEach((p) => {
                    semRecs[p.grantPeriod] = 'OK';
                });
            }
            scholar = {
                ibmId: grad.ibmId,
                fullName: grad.fullName,
                firstName: grad.firstName || '',
                lastName: grad.lastName || grad.fullName,
                school: grad.school || '—',
                course: grad.course || '—',
                barangay: grad.barangay || '—',
                tribe: grad.tribe || '—',
                yearLevel: yrDisplay,
                schoolId: grad.schoolId || '—',
                startingYear: '—',
                contact: grad.contact || '—',
                sex: grad.gender || grad.sex || '—',
                gender: grad.gender || grad.sex || '—',
                lbpAccount: grad.lbpAccount || 'Not Provided',
                status: 'GRADUATED',
                semesterRecords: semRecs,
                semesterCount: 8,
                remarks: details.length > 0 ? details.join(' | ') : 'Iskolar Bayan Alumni Graduate'
            };
        }
    }
    // If still not found, check otherGrantsData
    if (!scholar && typeof otherGrantsData !== 'undefined' && otherGrantsData && otherGrantsData.length > 0) {
        const og = otherGrantsData.find((o) => o.ibmId === ibmId);
        if (og) {
            scholar = {
                ibmId: og.ibmId,
                fullName: og.fullName,
                firstName: og.firstName || '',
                lastName: og.lastName || og.fullName,
                school: og.school || '—',
                course: og.course || '—',
                barangay: og.barangay || '—',
                tribe: og.tribe || '—',
                yearLevel: 'Other Grant Beneficiary',
                schoolId: '—',
                startingYear: '—',
                contact: og.contact || '—',
                sex: og.gender || '—',
                lbpAccount: 'Not Provided',
                status: 'ACTIVE',
                semesterRecords: {},
                semesterCount: 0,
                remarks: `External Grant: ${og.grantName || og.otherGrant || 'Other Scholarship'}`
            };
        }
    }
    if (!scholar)
        return;
    currentViewScholar = scholar;
    // Header info
    const drawerTitle = document.getElementById('drawerScholarName');
    if (drawerTitle) {
        drawerTitle.textContent = (scholar.status === 'GRADUATED') ? 'Alumni Graduate Profile' : 'Scholar Record';
    }
    const nameEl = document.getElementById('drawerHeaderFullName');
    if (nameEl)
        nameEl.textContent = scholar.fullName || `${scholar.lastName}, ${scholar.firstName}`;
    const idEl = document.getElementById('drawerHeaderIbmId') || document.getElementById('drawerIbmId');
    if (idEl)
        idEl.textContent = scholar.ibmId || 'N/A';
    const initials = (scholar.firstName ? scholar.firstName[0] : '') + (scholar.lastName ? scholar.lastName[0] : '');
    const avatarEl = document.getElementById('drawerAvatarInitial') || document.getElementById('drawerAvatar');
    if (avatarEl)
        avatarEl.textContent = initials.toUpperCase() || 'IB';
    // Status Badge
    const statusEl = document.getElementById('drawerStatusBadge');
    if (statusEl) {
        let badgeClass = 'badge-active';
        const st = (scholar.status || 'ACTIVE').toUpperCase();
        if (st === 'PROBATION')
            badgeClass = 'badge-probation';
        else if (st === 'WARNING')
            badgeClass = 'badge-warning';
        else if (st === 'GRADUATED')
            badgeClass = 'badge-graduated';
        else if (st === 'DELISTED')
            badgeClass = 'badge-delisted';
        else if (st === 'EXTENDED')
            badgeClass = 'badge-extended';
        statusEl.innerHTML = `<span class="lgu-badge ${badgeClass}">${scholar.status || 'ACTIVE'}</span>`;
    }
    // Details population helper
    const setTxt = (id, val) => {
        const el = document.getElementById(id);
        if (el)
            el.textContent = val || '—';

function applyAlumniFilterLogic() {
    const search = (document.getElementById('searchAlumni')?.value || '').toLowerCase().trim();
    const selYear = document.getElementById('alumniFilterYear')?.value || '';
    const selBrgy = document.getElementById('alumniFilterBrgy')?.value || '';
    filteredAlumniData = (gradData || []).filter(g => {
        const name = (g.fullName || `${g.firstName} ${g.lastName}`).toLowerCase();
        const ibm = (g.ibmId || '').toLowerCase();
        const course = (g.course || '').toLowerCase();
        const school = (g.school || '').toLowerCase();
        const brgy = g.barangay || '';
        const yr = String(g.yearGraduated || g.gradYear || g.year || '');
        const matchSearch = !search || name.includes(search) || ibm.includes(search) || course.includes(search) || school.includes(search);
        const matchYear = !selYear || yr === selYear;
        const matchBrgy = !selBrgy || brgy === selBrgy;
        return matchSearch && matchYear && matchBrgy;
    });
    displayAlumniRows();
}
function displayAlumniRows() {
    const tbody = document.getElementById('alumniBody');

        return;

        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">No alumni records found matching filters.</td></tr>`;

    const rows = filteredAlumniData.map((g, i) => [

function loadAuditLogs() {
    const tbody = document.getElementById('auditLogsBody');
    if (tbody) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Loading audit trail...</td></tr>`;
    }
    google.script.run
        .withSuccessHandler(res => {
        auditLogsData = res || [];
        filterAuditLogs();
    })
        .withFailureHandler(err => {
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger); padding: 30px;">Unable to fetch audit logs: ${err.message}</td></tr>`;
        }
    })
        .getAuditLogs();
}
function filterAuditLogs() {
    const search = (document.getElementById('searchAudit')?.value || '').toLowerCase().trim();
    const actionFilter = document.getElementById('auditActionFilter')?.value || '';
    filteredAuditData = auditLogsData.filter(log => {
        const text = `${log.action || ''} ${log.user || ''} ${log.details || ''} ${log.ip_address || ''}`.toLowerCase();
        const matchSearch = !search || text.includes(search);
        const matchAction = !actionFilter || (log.action && log.action.toUpperCase().includes(actionFilter));
        return matchSearch && matchAction;
    });
    auditCurrentPage = 1;
    displayAuditRows();
}
function displayAuditRows() {
    const tbody = document.getElementById('auditLogsBody');
    const info = document.getElementById('auditPageInfo');
    if (!tbody)
        return;
    tbody.innerHTML = '';
    const total = filteredAuditData.length;
    if (total === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No audit trail events recorded.</td></tr>`;
        if (info)
            info.textContent = 'Showing 0 to 0 of 0 entries';
        return;
    }
    const start = (auditCurrentPage - 1) * auditRowsPerPage;
    const end = Math.min(start + auditRowsPerPage, total);
    const slice = filteredAuditData.slice(start, end);
    slice.forEach(log => {
        const tr = document.createElement('tr');
        let actionBadge = 'badge-lgu-neutral';
        const act = (log.action || '').toUpperCase();
        if (act.includes('UPDATE') || act.includes('BATCH') || act.includes('EDIT'))
            actionBadge = 'badge-lgu-primary';
        else if (act.includes('INSERT') || act.includes('ADD'))
            actionBadge = 'badge-lgu-success';
        else if (act.includes('DELETE') || act.includes('DELIST') || act.includes('DISMISS'))
            actionBadge = 'badge-lgu-danger';
        else if (act.includes('LOGIN'))
            actionBadge = 'badge-lgu-gold';
        const timeDisplay = log.created_at || log.timestamp || '—';
        tr.innerHTML = `
            <td style="white-space: nowrap; font-size: 0.8rem; color: var(--text-secondary);">${timeDisplay}</td>
            <td><strong style="color: var(--text-primary);">${log.user || 'admin'}</strong></td>
            <td><span class="badge-lgu ${actionBadge}">${act}</span></td>
            <td style="font-size: 0.85rem; color: var(--text-secondary); word-break: break-word; line-height: 1.4;">${log.details || '—'}</td>
            <td style="font-size: 0.75rem; color: var(--text-muted);">${log.ip_address || '127.0.0.1'}</td>
        `;
        tbody.appendChild(tr);
    });
    if (info) {
        info.textContent = `Showing ${start + 1} to ${end} of ${total} events`;
    }
}
function changeAuditPage(delta) {
    const totalPages = Math.ceil(filteredAuditData.length / auditRowsPerPage) || 1;
    auditCurrentPage += delta;
    if (auditCurrentPage < 1)
        auditCurrentPage = 1;
    if (auditCurrentPage > totalPages)
        auditCurrentPage = totalPages;
    displayAuditRows();
}
function exportAuditLogsCSV() {
    if (!filteredAuditData || filteredAuditData.length === 0) {
        Swal.fire('Notice', 'No audit logs to export', 'info');
        return;
    }
    const headers = ['Timestamp', 'User', 'Action', 'Details', 'IP Address'];

        l.created_at || '',
        l.user || 'admin',
        l.action || '',
        `"${(l.details || '').replace(/"/g, '""')}"`,
        l.ip_address || ''
    ]);
    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `Malungon_IBMS_AuditLogs_${new Date().toISOString().split('T')[0]}.csv`);

    let loaderInterval;

    function toggleLoader(show) {
        const loader = document.getElementById('loader');
        const bar = document.getElementById('loaderBar');
        const txt = document.getElementById('loaderText');
        
        if (show) {
            loader.style.display = 'flex';
            let width = 0;
            bar.style.width = '0%';
            txt.innerText = 'Processing... 0%';
            
            clearInterval(loaderInterval);
            loaderInterval = setInterval(() => {
                // Increment logic: Fast at start, slow at end to fake progress
                if (width >= 90) {
                    if(width < 95) width += 0.1; // Crawl at the end
                } else {
                    width += Math.random() * 5; // Random jumps
                }
                bar.style.width = width + '%';
                txt.innerText = `Processing... ${Math.floor(width)}%`;
            }, 200);
        } else {
            clearInterval(loaderInterval);
            bar.style.width = '100%';
            txt.innerText = 'Complete! 100%';
            
            setTimeout(() => {
                loader.style.display = 'none';
                bar.style.width = '0%'; // Reset for next time
            }, 600); // Short delay to see the 100% completion
        }
    }

    function getFilteredScholars() {
        const mode = document.getElementById('reportMode') ? document.getElementById('reportMode').value : 'utilized';
        const sem = document.getElementById('reportSem') ? document.getElementById('reportSem').value : '';
        const prevSem = document.getElementById('reportPrevSem') ? document.getElementById('reportPrevSem').value : '';

        // Global Pre-Filters
        const brgyFilter = document.getElementById('reportFilterBrgy') ? document.getElementById('reportFilterBrgy').value : '';
        const yearFilter = document.getElementById('reportFilterYear') ? document.getElementById('reportFilterYear').value : '';
        const sexFilter = document.getElementById('reportFilterSex') ? document.getElementById('reportFilterSex').value : '';
        const statusFilter = document.getElementById('reportFilterStatus') ? document.getElementById('reportFilterStatus').value : '';

        if (!dbData || dbData.length === 0) return [];

        let currentSemVal = sem;
        let prevSemVal = prevSem;
        if (sems && sems.length > 0) {
            if (!currentSemVal) currentSemVal = sems[sems.length - 1];
            if (!prevSemVal) prevSemVal = sems.length > 1 ? sems[sems.length - 2] : currentSemVal;
        }

        const validSemStatuses = ['OK', 'NEW', 'ACTIVE', 'FIN', 'MED', 'PROBATION', 'WARNING'];
        const activeDbStatuses = ['ACTIVE', 'NEW', 'EXTENDED', 'WARNING', 'PROBATION', 'ON-LEAVE (MEDICAL)', 'ON-LEAVE (FINANCIAL)', 'ON-HOLD'];

        return dbData.filter(s => {
            // 1. Mode Matching
            let modeMatch = true;
            const currRec = currentSemVal ? ((s.semesterRecords && s.semesterRecords[currentSemVal]) || '').trim().toUpperCase() : '';
            const prevRec = prevSemVal ? ((s.semesterRecords && s.semesterRecords[prevSemVal]) || '').trim().toUpperCase() : '';
            const dbStatus = (s.status || '').trim().toUpperCase();

            if (mode === 'utilized') {
                modeMatch = currRec === 'OK';
            } else if (mode === 'active_baseline') {
                modeMatch = validSemStatuses.includes(prevRec) || activeDbStatuses.includes(dbStatus);
            } else if (mode === 'all') {
                modeMatch = true;
            } else if (mode === 'pending') {
                const wasActive = validSemStatuses.includes(prevRec) || activeDbStatuses.includes(dbStatus);
                const isProcessed = currRec === 'OK';
                modeMatch = wasActive && !isProcessed;
            } else if (mode === 'overstaying') {
                modeMatch = parseInt(s.semesterCount || 0) >= 8;
            } else if (mode === 'atrisk') {
                const validRecords = ['OK', 'FIN', 'MED'];
                modeMatch = activeDbStatuses.includes(dbStatus) && !validRecords.includes(currRec) && !validRecords.includes(prevRec);
            }

            if (!modeMatch) return false;

            // 2. Global Pre-Filters Match
            if (brgyFilter && s.barangay !== brgyFilter) return false;
            if (yearFilter && !(s.yearLevel || '').includes(yearFilter.split(' ')[0])) return false;
            if (sexFilter && s.sex !== sexFilter) return false;
            if (statusFilter && s.status !== statusFilter) return false;

            return true;
        });
    }

    function generateReport() {
        const group = document.getElementById('reportGroup') ? document.getElementById('reportGroup').value : 'barangay';
        const validScholars = getFilteredScholars();

        const totalCountEl = document.getElementById('reportTotalCount');
        if (totalCountEl) totalCountEl.innerText = validScholars.length.toLocaleString();

        // Grouping
        reportCounts = {};
        validScholars.forEach(s => {
            let key = s[group] || 'Unassigned';
            if(group === 'school') key = s.school || 'Unspecified School';
            if(group === 'course') key = s.course || 'Unspecified Course';
            if(group === 'status') key = s.status || 'ACTIVE';
            key = key.trim() || 'Unassigned';
            reportCounts[key] = (reportCounts[key] || 0) + 1;
        });

        const sortedKeys = Object.keys(reportCounts).sort((a, b) => reportCounts[b] - reportCounts[a]);
        const summaryBody = document.getElementById('reportSummaryBody');
        const total = validScholars.length;

        if (sortedKeys.length === 0) {
            if (summaryBody) summaryBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color: var(--text-muted);">No records found.</td></tr>';
            if (document.getElementById('reportChart')) document.getElementById('reportChart').style.display = 'none';
            if (document.getElementById('chartPlaceholder')) document.getElementById('chartPlaceholder').style.display = 'block';
            if (document.getElementById('reportInsights')) document.getElementById('reportInsights').style.display = 'none';
        } else {
            if (summaryBody) {
                summaryBody.innerHTML = sortedKeys.map(key => {
                    const count = reportCounts[key];
                    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
                    return `
                        <tr class="report-row" onclick="viewReportList('${key.replace(/'/g, "\\'")}')" style="cursor: pointer;">
                            <td style="font-weight: 700; color: var(--text-primary);">${key}</td>
                            <td style="text-align: right; font-weight: 800; color: var(--primary);">${count}</td>
                            <td style="text-align: right; font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">${pct}%</td>
                        </tr>
                    `;
                }).join('');
            }

            if(typeof updateReportChart === 'function') updateReportChart(sortedKeys, sortedKeys.map(k => reportCounts[k]), group);
            if(typeof generateReportInsights === 'function') generateReportInsights(validScholars, reportCounts);
        }

        // Reset Detail View
        rCurrentData = [];
        rCurrentPage = 1;
        if(typeof renderReportDetailTable === 'function') renderReportDetailTable();
        const titleEl = document.getElementById('detailListTitle');
        const countEl = document.getElementById('detailListCount');
        if (titleEl) titleEl.innerText = "Detailed List";
        if (countEl) countEl.innerText = "0 Records";
    }

    // --- VISUALIZATION (Chart.js) ---
    function updateReportChart(labels, data, group) {
        const placeholder = document.getElementById('chartPlaceholder');
        if (placeholder) placeholder.style.display = 'none';
        const canvas = document.getElementById('reportChart');
        if (!canvas) return;
        canvas.style.display = 'block';
        const ctx = canvas.getContext('2d');
        
        if (reportChartInstance) reportChartInstance.destroy();

        const isHorizontalBar = (group === 'barangay' || group === 'school' || group === 'course');
        const chartType = isHorizontalBar ? 'bar' : (group === 'sex' || group === 'status' ? 'doughnut' : 'bar');

        const palette = [
            '#0c2340', '#059669', '#d97706', '#3b82f6', '#8b5cf6', 
            '#ec4899', '#06b6d4', '#10b981', '#f97316', '#6366f1',
            '#14b8a6', '#e11d48', '#84cc16', '#a855f7', '#64748b'
        ];

        let chartLabels = labels;
        let chartData = data;
        if (labels.length > 14 && isHorizontalBar) {
            const paired = labels.map((l, i) => ({ label: l, val: data[i] })).sort((a, b) => b.val - a.val);
            const top13 = paired.slice(0, 13);
            const othersVal = paired.slice(13).reduce((sum, item) => sum + item.val, 0);
            chartLabels = top13.map(p => p.label).concat(['Other ' + (group === 'barangay' ? 'Barangays' : 'Institutions')]);
            chartData = top13.map(p => p.val).concat([othersVal]);
        }

        reportChartInstance = new Chart(ctx, {
            type: chartType,
            data: {
                labels: chartLabels,
                datasets: [{
                    label: ' Scholars',
                    data: chartData,
                    backgroundColor: chartType === 'doughnut' ? palette : palette[0],
                    borderRadius: chartType === 'bar' ? 4 : 0,
                    borderWidth: chartType === 'doughnut' ? 2 : 0,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: isHorizontalBar ? 'y' : 'x', 
                plugins: {
                    legend: { display: chartType === 'doughnut', position: 'right' },
                    tooltip: { backgroundColor: '#0c2340', padding: 12 }
                },
                scales: chartType === 'bar' ? {
                    x: { grid: { display: isHorizontalBar, borderDash: [4, 4] } },
                    y: { grid: { display: !isHorizontalBar, borderDash: [4, 4] }, ticks: { font: { size: 10 } } }
                } : {}
            }
        });
    }

    // --- SMART INSIGHTS ---

            const currentSem = sems[sems.length - 1];
            const prevSem = sems[sems.length - 2];
            const activeDbStatuses = ['ACTIVE', 'EXTENDED', 'WARNING', 'PROBATION', 'ON-HOLD'];
            
            atRiskCount = scholars.filter(s => {
                const dbStatus = (s.status || '').toUpperCase().trim();
                const currRec = ((s.semesterRecords && s.semesterRecords[currentSem]) || '').trim().toUpperCase();
                const prevRec = ((s.semesterRecords && s.semesterRecords[prevSem]) || '').trim().toUpperCase();
                const validRecords = ['OK', 'FIN', 'MED'];

                       !validRecords.includes(currRec) &&

            }).length;
        }

                <div style="font-weight: 800; font-size: 1.8rem; color: var(--text-main); margin-top: 4px;">${overstaying}</div>
                <div style="font-size: 0.8rem; color: var(--text-secondary);">Requires academic review</div>

    function viewInsightList(insightType) {
        const validScholars = getFilteredScholars();

        document.querySelectorAll('.report-row').forEach(r => r.classList.remove('active'));

        if (insightType === 'onleave') {
            rCurrentData = validScholars.filter(s => s.status && s.status.includes('LEAVE'));
            currentReportFilter = "On-Leave (Medical/Financial)";
        } else if (insightType === 'overstaying') {
            rCurrentData = validScholars.filter(s => parseInt(s.semesterCount || 0) >= 8);
            currentReportFilter = "Overstaying (Sem 8+)";
        } else if (insightType === 'atrisk') {
            const currentSem = sems[sems.length - 1];
            const prevSem = sems[sems.length - 2];
            const activeDbStatuses = ['ACTIVE', 'EXTENDED', 'WARNING', 'PROBATION', 'ON-HOLD'];
            
            rCurrentData = validScholars.filter(s => {
                const dbStatus = (s.status || '').toUpperCase().trim();
                const currRec = ((s.semesterRecords && s.semesterRecords[currentSem]) || '').trim().toUpperCase();
                const prevRec = ((s.semesterRecords && s.semesterRecords[prevSem]) || '').trim().toUpperCase();
                const validRecords = ['OK', 'FIN', 'MED'];
                
                return activeDbStatuses.includes(dbStatus) && 
                       !validRecords.includes(currRec) && 
                       !validRecords.includes(prevRec);
            });
            currentReportFilter = "Pre-Delisted (2 Consecutive Blank Sems)";
        }

        currentReportList = rCurrentData;
        rCurrentPage = 1;

        const titleEl = document.getElementById('detailListTitle');
        const countEl = document.getElementById('detailListCount');
        if (titleEl) titleEl.innerText = `Insight: ${currentReportFilter}`;
        if (countEl) countEl.innerText = `${rCurrentData.length} Records`;

        renderReportDetailTable();
        const detailBody = document.getElementById('reportDetailBody');
        if (detailBody) detailBody.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // --- CSV EXPORTS ---
    function exportSummaryCSV() {
        if(Object.keys(reportCounts).length === 0) return Swal.fire('Error', 'No data to export', 'error');
        const groupEl = document.getElementById('reportGroup');
        const groupLabel = groupEl ? groupEl.options[groupEl.selectedIndex].text : 'Group';
        
        let csv = `Category (${groupLabel}),Count,Percentage\n`;
        const total = Object.values(reportCounts).reduce((a, b) => a + b, 0);
        Object.keys(reportCounts).sort().forEach(k => {
            const count = reportCounts[k];
            const pct = total > 0 ? (count / total * 100).toFixed(1) : 0;
            csv += `"${k}",${count},${pct}%\n`;
        });
        csv += `"TOTAL",${total},100%\n`;
        downloadCSV(csv, `IBM_Summary_${groupLabel.replace(/\s+/g, '_')}.csv`);
    }

    function exportDetailCSV() {
        if(currentReportList.length === 0) return Swal.fire('Error', 'No detailed data to export', 'error');
        
        let csv = "No,IBM ID,Full Name,School,Course,Year Level,Barangay,Status\n";
        currentReportList.forEach((s, i) => {
            csv += `${i+1},"${s.ibmId}","${s.fullName}","${s.school || ''}","${s.course || ''}","${s.yearLevel || ''}","${s.barangay || ''}","${s.status || ''}"\n`;
        });
        downloadCSV(csv, `IBM_DetailList_${(currentReportFilter || 'All').replace(/\s+/g, '_')}.csv`);
    }

    function downloadCSV(csv, filename) {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function generateMatrixReport() {
        const validScholars = getFilteredScholars();
        
        if(!validScholars || validScholars.length === 0) {
            return Swal.fire('No Data', 'Please select a valid semester/report type with data.', 'warning');

        barangaysList.forEach(b => {
            matrix[b] = { total: 0 };
            years.forEach(y => matrix[b][y] = 0);
        });
        
        const colTotals = {};
        years.forEach(y => colTotals[y] = 0);
        let grandTotal = 0;

        validScholars.forEach(s => {
            const b = s.barangay || 'Unassigned';
            const yRaw = (s.yearLevel || '').toUpperCase();
            
            let mappedYear = 'Other';
            if(yRaw.includes('1') || yRaw.includes('IST')) mappedYear = '1st Year';
            else if(yRaw.includes('2') || yRaw.includes('2ND')) mappedYear = '2nd Year';
            else if(yRaw.includes('3') || yRaw.includes('3RD')) mappedYear = '3rd Year';
            else if(yRaw.includes('4') || yRaw.includes('4TH')) mappedYear = '4th Year';
            else if(yRaw.includes('5') || yRaw.includes('5TH')) mappedYear = '5th Year';

                if(mappedYear !== 'Other') {
                    matrix[b][mappedYear]++;

        if (mTable) {
            let mHtml = `
                <thead>
                    <tr>
                        <th style="width: 25%;">Barangay</th>
                        ${years.map(y => `<th style="text-align:center;">${y}</th>`).join('')}
                        <th style="text-align:center;">Total</th>
                    </tr>
                </thead>
                <tbody>
            `;

            Object.keys(matrix).sort().forEach(b => {
                mHtml += `<tr><td style="font-weight:700;">${b}</td>`;
                years.forEach(y => {
                    const count = matrix[b][y] || 0;

                        mHtml += `<td style="text-align:center;"><button type="button" class="matrix-btn" onclick="openMatrixCellDrilldown('brgy_year', '${b}', '${y}')" title="Click to view ${count} scholars">${count}</button></td>`;

                        mHtml += `<td style="text-align:center; color: var(--text-muted); opacity: 0.4;">0</td>`;
                    }
                });
                mHtml += `<td style="text-align:center;"><button type="button" class="matrix-btn matrix-btn-total" onclick="openMatrixCellDrilldown('brgy_total', '${b}', 'ALL')" title="Click to view all ${matrix[b].total} scholars in ${b}">${matrix[b].total}</button></td></tr>`;
            });

            mHtml += `
                <tr style="background:var(--border-light); font-weight:800;">
                    <td style="text-transform: uppercase; letter-spacing: 0.05em;">GRAND TOTAL</td>
                    ${years.map(y => `<td style="text-align:center;"><button type="button" class="matrix-btn matrix-btn-grand" onclick="openMatrixCellDrilldown('grand_total', 'ALL', '${y}')" title="View all ${colTotals[y]} scholars in ${y}">${colTotals[y]}</button></td>`).join('')}
                    <td style="font-size: 1.1rem; text-align:center; color: var(--primary);">${grandTotal}</td>
                </tr>
                </tbody>
            `;
            mTable.innerHTML = mHtml;
        }

        // MATRIX 2: STATUS vs YEAR LEVEL
        const statusMatrix = {};
        const yearsCols = ['1st Year', '2nd Year', '3rd Year', '4th Year', '5th Year'];

        validScholars.forEach(s => {
            let st = s.status ? s.status.trim().toUpperCase() : 'ACTIVE';
            if(!statusMatrix[st]) {
                 statusMatrix[st] = { total: 0 };
                 yearsCols.forEach(y => statusMatrix[st][y] = 0);
            }

            const yRaw = (s.yearLevel || '').toUpperCase();
            let mappedYear = 'Other';
            if(yRaw.includes('1') || yRaw.includes('IST') || yRaw.includes('FRESH')) mappedYear = '1st Year';
            else if(yRaw.includes('2') || yRaw.includes('2ND') || yRaw.includes('SOPH')) mappedYear = '2nd Year';
            else if(yRaw.includes('3') || yRaw.includes('3RD') || yRaw.includes('JUN')) mappedYear = '3rd Year';
            else if(yRaw.includes('4') || yRaw.includes('4TH') || yRaw.includes('SEN')) mappedYear = '4th Year';
            else if(yRaw.includes('5')) mappedYear = '5th Year';

            if(mappedYear !== 'Other') {
                statusMatrix[st][mappedYear]++;
            }
            statusMatrix[st].total++;
        });

        const sortedStatuses = Object.keys(statusMatrix).sort((a, b) => {
            const order = ['ACTIVE', 'NEW', 'EXTENDED', 'OK', 'WARNING', 'PROBATION', 'ON-LEAVE (MEDICAL)', 'ON-LEAVE (FINANCIAL)', 'STOPPED', 'DELISTED', 'GRADUATED'];
            const idxA = order.indexOf(a);
            const idxB = order.indexOf(b);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.localeCompare(b);
        });

        const sTable = document.getElementById('statusMatrixTable');
        if (sTable) {
            let sHtml = `
                <thead>
                    <tr>
                        <th style="width: 25%;">Academic Status</th>
                        ${yearsCols.map(y => `<th style="text-align:center;">${y}</th>`).join('')}
                        <th style="text-align:center;">Total</th>
                    </tr>
                </thead>
                <tbody>
            `;
            
            let totalActive = 0; 
            sortedStatuses.forEach(st => {
                let badgeClass = 'secondary';
                if(st === 'ACTIVE' || st === 'NEW' || st === 'OK') badgeClass = 'success';
                else if(st === 'EXTENDED' || st === 'WARNING') badgeClass = 'warning';
                else if(st === 'PROBATION') badgeClass = 'probation';
                else if(st.includes('MEDICAL')) badgeClass = 'payroll';
                else if(st.includes('FINANCIAL') || st.includes('ON-LEAVE')) badgeClass = 'warning';
                else if(st === 'STOPPED' || st === 'DELISTED' || st.includes('DECEASED')) badgeClass = 'danger';
                else if(st === 'GRADUATED') badgeClass = 'graduated';

                sHtml += `
                <tr>
                    <td style="font-weight: 600;">
                        <span class="badge badge-${badgeClass}" style="font-size: 0.8rem;">${st}</span>
                    </td>`;
                yearsCols.forEach(y => {
                    const count = statusMatrix[st][y] || 0;
                    if (count > 0) {
                        sHtml += `<td style="text-align:center;"><button type="button" class="matrix-btn" onclick="openMatrixCellDrilldown('status_year', '${st}', '${y}')" title="View ${count} scholars">${count}</button></td>`;
                    } else {
                        sHtml += `<td style="text-align:center; color: var(--text-muted); opacity: 0.4;">0</td>`;
                    }
                });
                sHtml += `<td style="text-align:center;"><button type="button" class="matrix-btn matrix-btn-total" onclick="openMatrixCellDrilldown('status_total', '${st}', 'ALL')">${statusMatrix[st].total}</button></td></tr>`;
                
                totalActive += statusMatrix[st].total;
            });

            sHtml += `
                <tr style="background-color: var(--border-light); font-weight: 800;">
                    <td style="text-transform: uppercase; letter-spacing: 0.05em;">Grand Total</td>
                    <td colspan="5"></td>
                    <td style="text-align:center; font-size: 1.1rem; color: var(--primary);">${totalActive}</td>
                </tr>
            </tbody>`;
            sTable.innerHTML = sHtml;
        }

        // Duration Analysis
        if(typeof generateDurationMatrix === 'function') {
            generateDurationMatrix(validScholars);
        }
    }

    // --- INTERACTIVE MATRIX DRILL-DOWN MODAL LOGIC ---
    function openMatrixCellDrilldown(type, rowKey, colKey) {
        const validScholars = getFilteredScholars();
        let matching = [];
        let title = "";
        let subtitle = "";

        if (type === 'brgy_year') {
            matching = validScholars.filter(s => {
                const b = s.barangay || 'Unassigned';
                const yRaw = (s.yearLevel || '').toUpperCase();
                let mappedYear = 'Other';
                if(yRaw.includes('1') || yRaw.includes('IST')) mappedYear = '1st Year';
                else if(yRaw.includes('2') || yRaw.includes('2ND')) mappedYear = '2nd Year';
                else if(yRaw.includes('3') || yRaw.includes('3RD')) mappedYear = '3rd Year';
                else if(yRaw.includes('4') || yRaw.includes('4TH')) mappedYear = '4th Year';
                else if(yRaw.includes('5') || yRaw.includes('5TH')) mappedYear = '5th Year';

                return b === rowKey && mappedYear === colKey;
            });
            title = `📍 ${rowKey} • ${colKey}`;
            subtitle = `Scholars from Barangay ${rowKey} enrolled in ${colKey}`;
        } else if (type === 'brgy_total') {
            matching = validScholars.filter(s => (s.barangay || 'Unassigned') === rowKey);
            title = `📍 ${rowKey} • All Year Levels`;
            subtitle = `All scholars registered under Barangay ${rowKey}`;
        } else if (type === 'grand_total') {
            matching = validScholars.filter(s => {
                const yRaw = (s.yearLevel || '').toUpperCase();
                let mappedYear = 'Other';
                if(yRaw.includes('1') || yRaw.includes('IST')) mappedYear = '1st Year';
                else if(yRaw.includes('2') || yRaw.includes('2ND')) mappedYear = '2nd Year';
                else if(yRaw.includes('3') || yRaw.includes('3RD')) mappedYear = '3rd Year';
                else if(yRaw.includes('4') || yRaw.includes('4TH')) mappedYear = '4th Year';
                else if(yRaw.includes('5') || yRaw.includes('5TH')) mappedYear = '5th Year';

                return mappedYear === colKey;
            });
            title = `🎓 All Barangays • ${colKey}`;
            subtitle = `Scholars across all barangays enrolled in ${colKey}`;
        } else if (type === 'status_year') {
            matching = validScholars.filter(s => {
                const st = s.status ? s.status.trim().toUpperCase() : 'ACTIVE';
                const yRaw = (s.yearLevel || '').toUpperCase();
                let mappedYear = 'Other';
                if(yRaw.includes('1') || yRaw.includes('IST') || yRaw.includes('FRESH')) mappedYear = '1st Year';
                else if(yRaw.includes('2') || yRaw.includes('2ND') || yRaw.includes('SOPH')) mappedYear = '2nd Year';
                else if(yRaw.includes('3') || yRaw.includes('3RD') || yRaw.includes('JUN')) mappedYear = '3rd Year';
                else if(yRaw.includes('4') || yRaw.includes('4TH') || yRaw.includes('SEN')) mappedYear = '4th Year';
                else if(yRaw.includes('5')) mappedYear = '5th Year';

                return st === rowKey && mappedYear === colKey;
            });
            title = `⚖️ Status: ${rowKey} • ${colKey}`;
            subtitle = `Scholars with status "${rowKey}" in ${colKey}`;
        } else if (type === 'status_total') {
            matching = validScholars.filter(s => (s.status ? s.status.trim().toUpperCase() : 'ACTIVE') === rowKey);
            title = `⚖️ Status: ${rowKey} • All Years`;
            subtitle = `All scholars with status "${rowKey}"`;
        } else if (type === 'school_year') {
            matching = validScholars.filter(s => {
                const sc = (s.school || 'Unspecified School').trim();
                const yRaw = (s.yearLevel || '').toUpperCase();
                let mappedYear = 'Other';
                if(yRaw.includes('1') || yRaw.includes('IST')) mappedYear = '1st Year';
                else if(yRaw.includes('2') || yRaw.includes('2ND')) mappedYear = '2nd Year';
                else if(yRaw.includes('3') || yRaw.includes('3RD')) mappedYear = '3rd Year';
                else if(yRaw.includes('4') || yRaw.includes('4TH')) mappedYear = '4th Year';
                else if(yRaw.includes('5') || yRaw.includes('5TH')) mappedYear = '5th Year';

                const matchSchool = rowKey === 'Other Institutions' ? true : sc === rowKey;
                return matchSchool && mappedYear === colKey;
            });
            title = `🏛️ ${rowKey} • ${colKey}`;
            subtitle = `Scholars enrolled at ${rowKey} in ${colKey}`;
        } else if (type === 'alumni_brgy_batch') {
            matching = (gradData || []).filter(g => {
                const b = (g.barangay || '').trim().toLowerCase();
                const y = g.gradYear ? String(g.gradYear).trim() : 'Unknown';
                return b === rowKey.toLowerCase() && (colKey === 'ALL' || y === colKey);
            });
            title = `🎓 Alumni: ${rowKey} ${colKey !== 'ALL' ? '• Batch ' + colKey : '• All Batches'}`;
            subtitle = `Graduated alumni from Barangay ${rowKey}`;
        } else if (type === 'alumni_honor_batch') {
            matching = (gradData || []).filter(g => {
                let hRaw = String(g.honor || '').toLowerCase().trim();
                let mappedHonor = "None/Blank";
                if(hRaw && hRaw !== 'none' && hRaw !== 'n/a') {
                    if(hRaw.includes('summa')) mappedHonor = "Summa Cum Laude";
                    else if(hRaw.includes('magna')) mappedHonor = "Magna Cum Laude";
                    else if(hRaw.includes('cum laude')) mappedHonor = "Cum Laude";
                    else mappedHonor = "Academic Excellence";
                }
                const y = g.gradYear ? String(g.gradYear).trim() : 'Unknown';
                return mappedHonor === rowKey && (colKey === 'ALL' || y === colKey);
            });
            title = `🏆 ${rowKey} ${colKey !== 'ALL' ? '• Batch ' + colKey : ''}`;
            subtitle = `Alumni recognized with ${rowKey}`;
        }

        currentDrilldownList = matching;

        const modal = document.getElementById('reportDrilldownModal');
        const titleEl = document.getElementById('drilldownTitle');
        const subEl = document.getElementById('drilldownSubtitle');
        const badgeEl = document.getElementById('drilldownCountBadge');
        const bodyEl = document.getElementById('drilldownTableBody');

        if (titleEl) titleEl.innerText = title;
        if (subEl) subEl.innerText = subtitle;
        if (badgeEl) badgeEl.innerText = `${matching.length} Scholars`;

        if (bodyEl) {
            if (matching.length === 0) {

                            <td style="color: var(--text-muted); font-size: 0.8rem;">${idx + 1}</td>

    // --- BULLETPROOF UNIFIED PRINT HELPER ---
    function executePrint(printClass, containerToClear = null) {
        const allPrintClasses = [
            'printing-list', 'printing-form', 'printing-furs', 'printing-ada',
            'printing-finance', 'printing-report', 'printing-matrix',
            'printing-tracking', 'printing-profile', 'printing-financial-list'
        ];
        allPrintClasses.forEach(c => document.body.classList.remove(c));
        document.body.classList.add(printClass);

        if (window.Swal && typeof window.Swal.close === 'function') {
            window.Swal.close();
        }
        document.body.classList.remove('swal2-shown', 'swal2-height-auto');

        if (typeof closeModal === 'function') closeModal();

        // Target container mapping
        const printContainerMap = {
            'printing-list': 'printArea',
            'printing-form': 'printPayrollFormArea',
            'printing-furs': 'printFursArea',
            'printing-ada': 'printAdaArea',
            'printing-finance': 'printFinanceArea',
            'printing-report': 'printReportArea',
            'printing-matrix': 'printMatrixArea',
            'printing-tracking': 'printTrackingArea',
            'printing-profile': 'printProfileArea',
            'printing-financial-list': 'printFinancialListArea'
        };

        const targetId = containerToClear || printContainerMap[printClass];
        const targetEl = targetId ? document.getElementById(targetId) : null;

        let cleanedUp = false;
        const cleanup = () => {
            if (cleanedUp) return;
            cleanedUp = true;
            document.body.classList.remove(printClass);
            const pFrame = document.getElementById('ibmsPrintHelperFrame');
            if (pFrame) {
                try { pFrame.remove(); } catch(e) {}
            }
            if (containerToClear) {
                const el = typeof containerToClear === 'string' ? document.getElementById(containerToClear) : containerToClear;
                if (el) el.innerHTML = '';
            }
            window.removeEventListener('afterprint', cleanup);
        };

        window.addEventListener('afterprint', cleanup, { once: true });
        setTimeout(cleanup, 60000);

        // Check if running inside Google Apps Script iframe or embedded frame
        const isInIframe = window.self !== window.top;

        if (isInIframe && targetEl && targetEl.innerHTML.trim().length > 0) {
            // IFRAME PRINT ISOLATION:
            // Google Apps Script runs inside an iframe (script.googleusercontent.com).
            // Calling window.print() directly inside an iframe in Chromium often prints outer frame or clips to 0 height.
            // Rendering an isolated print document guarantees 100% visible, non-blank output.
            try {
                let existingFrame = document.getElementById('ibmsPrintHelperFrame');
                if (existingFrame) existingFrame.remove();

                const pFrame = document.createElement('iframe');
                pFrame.id = 'ibmsPrintHelperFrame';
                pFrame.style.position = 'fixed';
                pFrame.style.right = '0';
                pFrame.style.bottom = '0';
                pFrame.style.width = '0';
                pFrame.style.height = '0';
                pFrame.style.border = '0';
                document.body.appendChild(pFrame);

                let allCss = '';
                for (let i = 0; i < document.styleSheets.length; i++) {
                    try {
                        const sheet = document.styleSheets[i];
                        for (let j = 0; j < sheet.cssRules.length; j++) {
                            allCss += sheet.cssRules[j].cssText + '\n';
                        }
                    } catch(e) {}
                }

                const frameDoc = pFrame.contentDocument || pFrame.contentWindow.document;
                frameDoc.open();
                frameDoc.write(`<!DOCTYPE html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <title>IBMS Print</title>
                    <style>
                        ${allCss}
                        html, body {
                            background: #ffffff !important;
                            margin: 0 !important;
                            padding: 0 !important;
                            overflow: visible !important;
                            height: auto !important;
                        }
                        #${targetEl.id} {
                            display: block !important;
                            visibility: visible !important;
                            position: static !important;
                            width: 100% !important;
                        }
                    </style>
                </head>
                <body class="${printClass}">
                    <div id="${targetEl.id}">${targetEl.innerHTML}</div>
                </body>
                </html>`);
                frameDoc.close();

                setTimeout(() => {
                    try {
                        pFrame.contentWindow.focus();
                        pFrame.contentWindow.print();
                    } catch(e) {
                        window.print();
                    }
                }, 350);
                return;
            } catch(iframeErr) {
                console.warn('Iframe print fallback to window.print', iframeErr);
            }
        }

        // Direct window print (Localhost / XAMPP / direct browser)
        setTimeout(() => {
            window.print();
        }, 250);
    }
    window.executePrint = executePrint;

function renderTrackingSummary() {
    const groupBy = document.getElementById('trackingSummaryGroup').value;
    const summary = {};

    // 1. Aggregate the data
    fullTrackingData.forEach(s => {
        let key = s[groupBy] || 'Unassigned / Blank';
        if (!summary[key]) {
            summary[key] = { baseline: 0, retained: 0, pending: 0, returning: 0, target: 0 };
        }

        if (s.inBaseline) summary[key].baseline++;
        if (s.inTarget) summary[key].target++;

        if (s.category === 'RETAINED') summary[key].retained++;
        else if (s.category === 'PENDING/MISSING') summary[key].pending++;
        else if (s.category === 'NEW/RETURNING') summary[key].returning++;
    });

    // 2. Build the HTML Table
    const tbody = document.getElementById('trackingSummaryTable');
    let html = `
        <thead style="position: sticky; top: 0; z-index: 10;">
            <tr>
                <th style="text-align: left; width: 25%;">${groupBy.toUpperCase()}</th>
                <th>Baseline (Prev Sem)</th>
                <th style="color: var(--success);">Retained</th>
                <th style="color: var(--warning);">Pending / Dropped</th>
                <th style="color: var(--primary);">New / Returning</th>
                <th>Processed (Target)</th>
            </tr>
        </thead>
        <tbody>
    `;

    let totals = { baseline: 0, retained: 0, pending: 0, returning: 0, target: 0 };

    Object.keys(summary).sort().forEach(key => {
        const row = summary[key];
        totals.baseline += row.baseline;
        totals.retained += row.retained;
        totals.pending += row.pending;
        totals.returning += row.returning;
        totals.target += row.target;

        html += `
            <tr style="background: var(--bg-surface);">
                <td style="font-weight: 700; text-align: left;">${key}</td>
                <td>${row.baseline}</td>
                <td style="color: var(--success); font-weight: bold;">${row.retained}</td>
                <td style="color: var(--warning); font-weight: bold;">${row.pending}</td>
                <td style="color: var(--primary); font-weight: bold;">${row.returning}</td>
                <td style="font-weight: 800; background: #f8fafc;">${row.target}</td>
            </tr>
        `;
    });

    // 3. Add Grand Total Row
    html += `
        <tr style="background: var(--border-light); font-weight: 800; text-transform: uppercase;">
            <td style="text-align: left;">GRAND TOTAL</td>
            <td>${totals.baseline}</td>
            <td style="color: var(--success);">${totals.retained}</td>
            <td style="color: var(--warning);">${totals.pending}</td>
            <td style="color: var(--primary);">${totals.returning}</td>
            <td style="font-size: 1.05rem;">${totals.target}</td>
        </tr>
        </tbody>
    `;

    tbody.innerHTML = html;
}
